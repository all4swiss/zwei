<!DOCTYPE html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0c0b0a"><title>Zwei</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><style>:root{--bg:#0c0b0a;--fg:#f6f0e6;--dim:#8a8278;--line:rgba(246,240,230,.1);--card:#161412;--gold:#e2c39a;--ok:#8faf86;--pad:22px;--b:env(safe-area-inset-bottom,0px);--t:env(safe-area-inset-top,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}body{max-width:430px;margin:0 auto;padding:0 0 calc(92px + var(--b))}.aura{pointer-events:none;position:fixed;left:0;right:0;top:0;height:280px;background:radial-gradient(120% 80% at 50% -10%,rgba(226,195,154,.22),transparent 70%)}.top{padding:calc(14px + var(--t)) var(--pad) 0;display:flex;justify-content:space-between;align-items:baseline}.kicker{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}h1{margin:4px 0 0;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:40px;font-weight:500;letter-spacing:-.04em;line-height:.95}.week{color:var(--dim);font-size:15px;font-weight:500}.chip{margin-left:10px;border:1px solid rgba(226,195,154,.35);background:transparent;color:var(--gold);border-radius:999px;padding:6px 11px;font:600 11px/1 -apple-system,sans-serif;letter-spacing:.12em;text-transform:uppercase}.wrap{padding:18px var(--pad) 0}.bar{height:3px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:8%;background:var(--gold)}.count{margin:10px 0 0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}.hero{margin-top:18px}.hero h2{margin:0;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:34px;font-weight:500;letter-spacing:-.03em;line-height:1.08}.cue{margin:8px 0 0;color:var(--dim);font-size:16px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:28px 0 14px}.tiles.one{grid-template-columns:1fr}.tile{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;min-height:108px}.tile span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}.tile input{width:100%;border:0;background:transparent;color:var(--fg);padding:8px 0 0;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:48px}.setn{color:var(--dim);font-size:14px;margin:0 0 16px}.go{width:100%;border:0;border-radius:22px;padding:18px;background:var(--fg);color:#14110e;font:600 17px/1 -apple-system,sans-serif}.links{display:flex;justify-content:space-between;margin:16px 2px 0}.links button{border:0;background:none;color:var(--dim);font:500 15px/1 -apple-system,sans-serif;padding:10px 0}details{margin-top:22px}details summary{color:var(--dim);font-size:14px}.note{margin-top:10px;width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:16px;padding:14px 16px;font-size:16px}.foot{display:flex;gap:8px;margin-top:28px}.quiet{flex:1;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:16px;padding:13px;font:500 14px/1 -apple-system,sans-serif}.hist{margin-top:28px;color:var(--dim);font-size:14px}.hist div{padding:12px 0;border-bottom:1px solid var(--line)}.lead{color:var(--dim);font-size:16px;margin:0 0 22px}.cuff{display:flex;align-items:flex-end;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px 20px 18px}.cuff label,.mini label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}.cuff input{width:100%;border:0;background:transparent;color:var(--fg);font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:52px}.slash{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:40px;color:var(--dim)}.mini{display:flex;gap:10px;margin:14px 0 18px}.mini>div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}.mini input{width:100%;border:0;background:transparent;color:var(--fg);font-size:22px}nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);padding:0 var(--pad) calc(14px + var(--b));display:flex;justify-content:center}.island{display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(22,20,18,.92);border:1px solid var(--line)}.island button{border:0;background:transparent;color:var(--dim);border-radius:999px;padding:12px 22px;font:600 15px/1 -apple-system,sans-serif}.island button.on{background:var(--fg);color:#14110e}.panel{display:none}.panel.on{display:block}.timer{position:fixed;inset:0;background:#0c0b0a;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;text-align:center}.timer.on{display:flex}.timer.done{background:#142016}.timer .lab{letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-size:12px;font-weight:600}.timer .n{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:108px;margin:8px 0 28px}.timer.done .n{color:var(--ok)}.timer button{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:12px 22px}</style></head><body><div class="aura"></div><header class="top"><div><p class="kicker">Einheit A · Chris</p><h1>Zwei</h1></div><div><span class="week" id="week">0 / 2</span><button type="button" class="chip" id="bpChip">BD</button></div></header><section id="panel-train" class="panel on"><div class="wrap"><div class="bar"><i id="bar"></i></div><p class="count" id="nowK">Übung 1 von 12</p><div class="hero"><h2 id="nowName">—</h2><p class="cue" id="nowCue"></p></div><div class="tiles" id="tiles"></div><p class="setn" id="setn"></p><button type="button" class="go" id="go">Satz fertig</button><div class="links"><button type="button" id="prev">Zurück</button><button type="button" id="skip">Überspringen</button><button type="button" id="next">Weiter</button></div><details><summary>So gemacht</summary><input class="note" id="nowNote" placeholder="z.B. 90 kg statt 80"></details><div class="foot"><button type="button" class="quiet" id="quick">Heute zählt</button><button type="button" class="quiet" id="finish">Einheit speichern</button></div><div class="hist" id="trainHist"></div></div></section><section id="panel-bp" class="panel"><div class="wrap"><p class="lead">Nur ein Log. Keine Bewertung.</p><div class="cuff"><div><label>Systolisch</label><input id="bpSys" inputmode="numeric" placeholder="128"></div><span class="slash">/</span><div><label>Diastolisch</label><input id="bpDia" inputmode="numeric" placeholder="82"></div></div><div class="mini"><div><label>Puls</label><input id="bpPulse" inputmode="numeric"></div><div><label>Zeit</label><input id="bpWhen" type="datetime-local"></div></div><input class="note" id="bpNote" placeholder="Notiz, optional"><button type="button" class="go" id="bpSave" style="margin-top:16px">Messung speichern</button><div class="hist" id="bpHist"></div></div></section><nav><div class="island"><button type="button" class="on" data-tab="train">Jetzt</button><button type="button" data-tab="bp">Blutdruck</button></div></nav><div class="timer" id="timer"><p class="lab" id="timerMsg">Pause</p><div class="n" id="timerN">1:00</div><button type="button" id="timerSkip">Weiter</button></div><script>const EX=[{id:1,name:"Ausfallschritte BOSU-Ball",cue:"jede Seite 1-2x",sets:[{reps:10},{reps:10}]},{id:2,name:"Beinpresse horizontal",cue:"mehr als 45 Grad",sets:[{reps:10,kg:80},{reps:10,kg:80}]},{id:3,name:"Latzug",cue:"mittlerer schwarzer Griff",sets:[{reps:10,kg:45},{reps:10,kg:45}]},{id:4,name:"Rudern, sitzend",cue:"Griff schmal, aufrecht",sets:[{reps:10,kg:50},{reps:10,kg:50}]},{id:5,name:"Ueberzuege Maschine",cue:"Sitzhoehe 7, Soll 10",sets:[{reps:10,kg:45},{reps:10,kg:45}]},{id:6,name:"Aussenrotation Kabelzug",cue:"",sets:[{reps:10,kg:5}]},{id:7,name:"Langlauf",cue:"",sets:[{reps:10,kg:10}]},{id:8,name:"Shrugs Kurzhantel",cue:"10 zurueck, 5 vor, 10 zurueck",sets:[{reps:25,kg:3}]},{id:9,name:"Trizepsstrecken Kabelzug",cue:"Arme am Oberkoerper",sets:[{reps:10,kg:15},{reps:10,kg:15}]},{id:10,name:"Scottcurls SZ-Stange",cue:"",sets:[{reps:10,kg:10},{reps:10,kg:10}]},{id:11,name:"Bauchpresse",cue:"1. Satz mit Beine, 2. ohne",sets:[{reps:20,kg:25},{reps:20,kg:25},{reps:20,kg:25}]},{id:12,name:"Brust Stretch stehend",cue:"kleiner - grosser Adler",sets:[{reps:7}]}];const K={sessions:"zwei-sessions",bp:"zwei-bp"};const $=id=>document.getElementById(id);const load=k=>{try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}};const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));function todayISO(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}function weekKey(d){const dt=new Date(d+"T12:00:00");dt.setDate(dt.getDate()-((dt.getDay()+6)%7));return dt.toISOString().slice(0,10)}let idx=0,seti=0;const live=EX.map(e=>({...e,sets:e.sets.map(s=>({...s,done:false})),note:""}));function render(){const e=live[idx],s=e.sets[seti]||e.sets[0];$("nowK").textContent="Uebung "+(idx+1)+" von "+live.length;$("bar").style.width=((idx+(e.sets.filter(x=>x.done).length/e.sets.length))/live.length*100)+"%";$("nowName").textContent=e.name;$("nowCue").textContent=e.cue||"Wie es sich anfuehlt.";$("nowNote").value=e.note;const hasKg=s.kg!=null;$("tiles").className="tiles"+(hasKg?"":" one");$("tiles").innerHTML='<div class="tile"><span>Wdh</span><input id="vReps" inputmode="numeric" value="'+s.reps+'"></div>'+(hasKg?'<div class="tile"><span>kg</span><input id="vKg" inputmode="decimal" value="'+s.kg+'"></div>':"");$("setn").textContent="Satz "+(seti+1)+" von "+e.sets.length;$("go").textContent=s.done?"Naechster Satz":"Satz fertig"}function pull(){const e=live[idx],s=e.sets[seti],r=$("vReps"),k=$("vKg");if(r)s.reps=r.value;if(k)s.kg=k.value;e.note=$("nowNote").value}function renderWeek(){const n=load(K.sessions).filter(s=>weekKey(s.date)===weekKey(todayISO())).length;$("week").textContent=n+" / 2"}function renderTrainHist(){const rows=load(K.sessions).slice().reverse().slice(0,6);$("trainHist").innerHTML=rows.length?rows.map(s=>"<div>"+s.date+" · "+(s.quick?"Heute zaehlt":"Einheit")+"</div>").join(""):"<div>Noch keine Einheit.</div>"}function bpToday(){return load(K.bp).some(r=>String(r.when).slice(0,10)===todayISO())}function renderBpChip(){$("bpChip").textContent=bpToday()?"BD ok":"BD"}function renderBpHist(){const rows=load(K.bp).slice().reverse();$("bpHist").innerHTML=rows.length?rows.map(r=>"<div>"+String(r.when).replace("T"," ").slice(0,16)+" · "+r.sys+" / "+r.dia+"</div>").join(""):"<div>Noch keine Messung.</div>"}function tab(name){document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id==="panel-"+name));document.querySelectorAll(".island button").forEach(b=>b.classList.toggle("on",b.dataset.tab===name))}let timerId=null;function startRest(){let left=60;$("timer").classList.add("on");$("timer").classList.remove("done");$("timerMsg").textContent="Pause";const tick=()=>{$("timerN").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");if(left<=0){clearInterval(timerId);$("timer").classList.add("done");$("timerMsg").textContent="Weiter, wenn du willst";try{navigator.vibrate&&navigator.vibrate([160,50,160])}catch(e){}return}left-=1};tick();clearInterval(timerId);timerId=setInterval(tick,1000)}function stopRest(){clearInterval(timerId);$("timer").classList.remove("on","done")}document.querySelectorAll(".island button").forEach(b=>b.addEventListener("click",()=>tab(b.dataset.tab)));$("bpChip").addEventListener("click",()=>tab("bp"));$("timerSkip").addEventListener("click",stopRest);$("prev").addEventListener("click",()=>{pull();idx=(idx+live.length-1)%live.length;seti=0;render()});$("next").addEventListener("click",()=>{pull();idx=(idx+1)%live.length;seti=0;render()});$("skip").addEventListener("click",()=>{pull();idx=Math.min(idx+1,live.length-1);seti=0;render()});$("go").addEventListener("click",()=>{pull();const e=live[idx];e.sets[seti].done=true;startRest();if(seti<e.sets.length-1)seti+=1;else if(idx<live.length-1){idx+=1;seti=0}render()});$("finish").addEventListener("click",()=>{pull();const all=load(K.sessions);all.push({date:todayISO(),at:new Date().toISOString(),exercises:live});save(K.sessions,all);renderWeek();renderTrainHist();alert("Einheit gespeichert.")});$("quick").addEventListener("click",()=>{pull();const all=load(K.sessions);all.push({date:todayISO(),at:new Date().toISOString(),quick:true,note:live[idx].note});save(K.sessions,all);renderWeek();renderTrainHist();alert("Heute zaehlt.")});$("bpSave").addEventListener("click",()=>{const sys=Number($("bpSys").value),dia=Number($("bpDia").value);if(!sys||!dia){alert("Systolisch und diastolisch eintragen.");return}const rows=load(K.bp);rows.push({when:$("bpWhen").value||new Date().toISOString(),sys,dia,pulse:$("bpPulse").value?Number($("bpPulse").value):null,note:$("bpNote").value.trim()});save(K.bp,rows);$("bpSys").value=$("bpDia").value=$("bpPulse").value=$("bpNote").value="";renderBpHist();renderBpChip()});(function(){const z=new Date(Date.now()-new Date().getTimezoneOffset()*6e4);$("bpWhen").value=z.toISOString().slice(0,16)})();render();renderWeek();renderTrainHist();renderBpHist();renderBpChip();if("serviceWorker"in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));</script></body></html>
